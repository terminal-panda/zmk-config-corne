manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned so local and CI builds match and upstream changes can't break the
      # build unexpectedly. To update: set a newer commit from zmkfirmware/zmk main,
      # run scripts/build-firmware.sh --update, check it builds, then push.
      revision: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85 # main, 2026-10-09
      import: app/west.yml
  self:
    path: config
